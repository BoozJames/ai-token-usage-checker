name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify tag commit is on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" origin/master
      - name: Verify tag matches package version
        run: node scripts/verify-release-tag.mjs
        env:
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}

  build:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx vsce package ${{ startsWith(env.RELEASE_TAG, 'v0.3.') && '--pre-release' || '' }} --target ${{ matrix.target }} --out ai-token-checker-${{ matrix.target }}.vsix
      - name: Enforce compact stable package
        if: ${{ !startsWith(env.RELEASE_TAG, 'v0.3.') }}
        run: node scripts/verify-vsix-size.mjs ai-token-checker-${{ matrix.target }}.vsix
      - run: node scripts/checksum.mjs ai-token-checker-${{ matrix.target }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ai-token-checker-${{ matrix.target }}.vsix
            ai-token-checker-${{ matrix.target }}.vsix.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" artifacts/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" artifacts/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes ${{ startsWith(env.RELEASE_TAG, 'v0.3.') && '--prerelease' || '' }} --title "AI Token Checker ${RELEASE_TAG}"
          fi

  publish-marketplace:
    needs: build
    if: vars.VSCE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Publish to Marketplace using OIDC
        shell: bash
        run: |
          release_args=()
          if [[ "${RELEASE_TAG}" == v0.3.* ]]; then release_args+=(--pre-release); fi
          npx --yes @vscode/vsce@3.9.3-12 publish --oidc --skip-duplicate "${release_args[@]}" --packagePath artifacts/*.vsix
