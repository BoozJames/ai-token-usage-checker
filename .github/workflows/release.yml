name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag; leave blank to use the selected branch package version
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Resolve and verify release tag
        id: resolve_tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then tag="${GITHUB_REF_NAME}"; fi
          if [[ -z "${tag}" ]]; then
            package_version=$(node -p "require('./package.json').version")
            tag="v${package_version}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH; got: ${tag}" >&2
            exit 1
          fi

          git fetch --tags origin
          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null

          git fetch origin master
          git merge-base --is-ancestor "refs/tags/${tag}^{commit}" origin/master

          # Compared inline against the checkout's package.json rather than by running a
          # checked-out script: the tag ref here can point at an old, immutable commit
          # whose own copy of any verification script predates later fixes to it, so that
          # script would keep failing forever regardless of what's fixed on master. Only
          # the tagged commit's *data* (package.json) needs to come from the checkout; the
          # comparison logic itself must come from the current workflow, not the tag.
          package_version=$(node -p "require('./package.json').version")
          expected_tag="v${package_version}"
          if [[ "${tag}" != "${expected_tag}" ]]; then
            echo "Release tag ${tag} does not match package version ${expected_tag}" >&2
            exit 1
          fi
          echo "Verified release tag ${tag}"

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  build:
    needs: verify-tag
    env:
      RELEASE_TAG: ${{ needs.verify-tag.outputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx vsce package ${{ startsWith(env.RELEASE_TAG, 'v0.3.') && '--pre-release' || '' }} --target ${{ matrix.target }} --out ai-token-checker-${{ matrix.target }}.vsix
      - name: Enforce compact stable package
        if: ${{ !startsWith(env.RELEASE_TAG, 'v0.3.') }}
        run: node scripts/verify-vsix-size.mjs ai-token-checker-${{ matrix.target }}.vsix
      - run: node scripts/checksum.mjs ai-token-checker-${{ matrix.target }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ai-token-checker-${{ matrix.target }}.vsix
            ai-token-checker-${{ matrix.target }}.vsix.sha256
          if-no-files-found: error

  release:
    needs: [verify-tag, build]
    env:
      RELEASE_TAG: ${{ needs.verify-tag.outputs.release_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" artifacts/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" artifacts/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes ${{ startsWith(env.RELEASE_TAG, 'v0.3.') && '--prerelease' || '' }} --title "AI Token Checker ${RELEASE_TAG}"
          fi

  publish-marketplace:
    needs: [verify-tag, build]
    if: vars.VSCE_PUBLISH_ENABLED == 'true'
    env:
      RELEASE_TAG: ${{ needs.verify-tag.outputs.release_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Publish to Marketplace using OIDC
        shell: bash
        run: |
          release_args=()
          if [[ "${RELEASE_TAG}" == v0.3.* ]]; then release_args+=(--pre-release); fi
          npx --yes @vscode/vsce@3.9.3-12 publish --oidc --skip-duplicate "${release_args[@]}" --packagePath artifacts/*.vsix
