name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag commit is on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Verify tag matches package version
        run: node scripts/verify-release-tag.mjs

  build:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx vsce package --pre-release --target ${{ matrix.target }} --out ai-token-checker-${{ matrix.target }}.vsix
      - run: node scripts/checksum.mjs ai-token-checker-${{ matrix.target }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ai-token-checker-${{ matrix.target }}.vsix
            ai-token-checker-${{ matrix.target }}.vsix.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --verify-tag --generate-notes --prerelease --title "AI Token Checker ${GITHUB_REF_NAME} (Preview)"

  publish-marketplace:
    needs: build
    if: vars.VSCE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Publish Marketplace pre-release using OIDC
        shell: bash
        run: npx vsce publish --oidc --pre-release --packagePath artifacts/*.vsix
