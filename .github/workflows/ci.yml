name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - name: Extension Host tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Extension Host tests
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Package validation
        run: npx vsce package --target ${{ matrix.target }} --out ai-token-checker-${{ matrix.target }}.vsix
      - name: Verify bundled runtime package
        run: node scripts/verify-vsix-size.mjs ai-token-checker-${{ matrix.target }}.vsix ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: ai-token-checker-${{ matrix.target }}.vsix
          if-no-files-found: error
